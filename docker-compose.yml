# NOT IN USE YET: we're using a native PostgreSQL install for local dev instead (Docker Desktop
# needs WSL2 on this machine). Revisit this file in the deployment/containerization phase.
services:
  # PostgreSQL database container - stores all application data.
  db:
    image: postgres:16-alpine   # official, free, open-source Postgres image (alpine = small size)
    container_name: collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_password   # local dev only - never used in production
      POSTGRES_DB: collab_db
    ports:
      - "5433:5432"   # host port 5433 (5432 is taken by a native Postgres service on this machine)
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persists data across container restarts

volumes:
  postgres_data:
